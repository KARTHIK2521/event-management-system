<div mat-dialog-title>
  {{data.eventName}}
</div>
<mat-dialog-content>
  <div class="dialog-container">

    <div class="dialog-section image-section" *ngFor="let item of eventImages">

      <img *ngIf="data.eventType === item.eType" [src]="item.src" alt="Image" class="dialog-image" />
    </div>


    <div class="dialog-section details-section">
      <h1 class="event-name">{{data.eventName}}</h1>
      <p class="event-description">
        {{data.aboutEvent}}
      </p>
    </div>
    <div class="dialog-section details-section">
      <div class="event-date-location">
        {{data.eventType}} | {{data.eventDuration}}hrs
      </div>
    </div>
    <hr/>
    <div class="dialog-section details-section">
      <div class="event-date-location">
         <div> {{ data.eventDate | date: 'EEEE, d MMMM y' }} at {{data.eventTime }}  <mat-icon class="location-icon">location_on</mat-icon> {{data.eventLocation}} | {{data.eventPrice | currency :'INR'}}</div>
      </div>
    </div>
    <!-- Section 3: Buttons -->
    <div class="dialog-section actions-section">
      <button mat-raised-button color="warn" class="mat-cls" (click)="closeEventDetail()">CLOSE</button>
    </div>
  </div>

</mat-dialog-content>
