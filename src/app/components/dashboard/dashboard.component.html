<!-- Event List  Section-->
<div class="card-container">
  <mat-card class="example-card card" *ngFor="let item of cardDataList" >
    <mat-card-header>
      <div mat-card-avatar class="example-header-image"></div>
      <mat-card-title>{{item.eventName}}</mat-card-title>
      <mat-card-subtitle>{{item.eventType}}</mat-card-subtitle>
    </mat-card-header>
    <ng-container *ngFor="let data of eventImages" >
      <img mat-card-image  *ngIf="item.eventType === data.eType" [src]="data.src" alt="Photo of evenst">
    </ng-container>

    <mat-card-content  class="mt-2">
      <p>
       {{item.aboutEvent}}
      </p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button >LIKE</button>
      <button mat-button >SHARE</button>
    </mat-card-actions>
  </mat-card>

</div>
